name: Matrix Docker Test

on: push

jobs:
  deploy:
    strategy:
      fail-fast: false # This allows all matrix combinations to run even if one fails, so we can see results for all combinations
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, ubuntu-20.04, windows-latest]
        image: [hello-world, alpine]
        exclude:
          - os: windows-latest
            image: alpine # Alpine doesn't have a Windows version, so we exclude this combination
        include:
          - os: ubuntu-20.04
            image: amd64/alpine:latest # Use a specific Alpine image for Ubuntu 20.04 to ensure compatibility

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Show Docker Info
        run: docker info

      - name: Run Docker Image
        run: docker run ${{ matrix.image }}

# This creates a matrix of:
# 3 OS options
# 2 Docker images

# So GitHub will run:

# ubuntu-latest + hello-world
# ubuntu-latest + alpine
# ubuntu-20.04 + hello-world
# ubuntu-20.04 + alpine
# windows-latest + hello-world
# windows-latest + alpine

# All in parallel (unless concurrency limits apply).