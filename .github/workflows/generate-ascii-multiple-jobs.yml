name: Generate ASCII Artwork with Multiple Jobs

on: push

jobs:
  build_job_1:
    runs-on: ubuntu-latest
    steps:
      - name: Install cowsay
        run: sudo apt-get install cowsay -y

      - name: Execute Cowsay cmd
        run: cowsay -f dragon "Run for cover, I am a dragon... RAWR!" >> dragon.txt

      - name: Upload dragon.txt as artifact
        uses: actions/upload-artifact@v3
        with:
          name: dragon-artifact
          path: dragon.txt

  test_job_2:
    needs: build_job_1
    runs-on: ubuntu-latest
    steps:
      - name: Download dragon.txt as artifact
        uses: actions/download-artifact@v3
        with:
          name: dragon-artifact

      - name: Test if dragon.txt exists
        run: grep -i dragon.txt && echo "dragon.txt exists" || echo "dragon.txt does not exist"

  deploy_job_3:
    needs: [test_job_2]
    runs-on: ubuntu-latest
    steps:
      - name: Download dragon.txt as artifact
        uses: actions/download-artifact@v3
        with:
          name: dragon-artifact

      - name: Display ASCII content
        run: cat dragon.txt || echo "dragon.txt not found, skipping display"
  

          
